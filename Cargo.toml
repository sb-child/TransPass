[package]
name = "transpass"
version = "0.1.0"
edition = "2024"
description = "Password Manager, but over-engineered"
authors = ["sbchild <sbchild0@gmail.com>"]
homepage = "https://github.com/sb-child/TransPass"
license = "MPL-2.0"

[dependencies]
anyhow = "1.0.100"
blake3 = { version = "1.8.2", features = ["zeroize", "serde", "rayon"] }
rayon = "1.11.0"
rmp-serde = "1.3.0"
secrets = { git = "https://github.com/sb-child/secrets-rs", rev = "76bd492a24e9281a123e2192a3f1f44e4a5ad1a3", features = [
    "fetch-latest",
    "optimized",
] }
libsodium-rs = { git = "https://github.com/sb-child/libsodium-rs", rev = "bb393c09045700e3d6edf74203e7754a59120634", features = [
    "fetch-latest",
    "optimized",
] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
zeroize = { version = "1.8.2", features = [
    "aarch64",
    "derive",
    "serde",
    "simd",
    "std",
] }
bincode = { version = "2.0.1", features = ["serde"] }
defer-rs = "0.1.0"
scopeguard = "1.2.0"
